alization, 800-token chunking with 100-token overlap, embedding via text-embedding-3-small, storage in PostgreSQL + pgvector) and a pedagogical orchestration layer: a Goal Router that conditions system prompts on learner intent, a Lesson Engine that generates grounded explanations with analogies and key takeaways, and a Quiz Engine that produces formative assessments. An LLM orchestrator composes lessons using cited vector retrieval to ensure grounding, while a Progress Service tracks mastery, identifies weak areas, and sequences remediation. This represents a shift from information retrieval to knowledge construction."})]})]}),g("section",{id:"layman",className:"scroll-mt-24 mb-20",children:[g("div",{className:"mb-6 flex items-baseline gap-3",children:[f("span",{className:"font-mono text-[11px] text-[#999] tracking-widest",children:"02"}),f("h2",{className:"font-serif text-[30px] leading-[1.1] tracking-[-0.02em]",style:{fontFamily:"Instrument Serif, serif"},children:"Layman Terms"})]}),f("div",{className:"rounded-[12px] border border-[#e5e5e5] dark:border-[#222] bg-white dark:bg-[#111] p-6 lg:p-7 mb-6",children:g("div",{className:"grid grid-cols-1 md:grid-cols-2 gap-6 text-[14px] leading-[1.7]",children:[g("div",{children:[f("div",{className:"text-[11px] tracking-widest uppercase text-[#999] mb-2",children:"What it is NOT"}),f("div",{className:"font-medium mb-1",children:"Chat with PDF = Librarian"}),f("p",{className:"text-[#666] dark:text-[#999]",children:"You ask “what does page 42 say about X?” and it finds the page. It doesn’t know the story. You still have to figure out what matters, in what order, and whether you understood it. Every question needs a good prompt."})]}),g("div",{children:[f("div",{className:"text-[11px] tracking-widest uppercase text-[#999] mb-2",children:"What it IS"}),f("div",{className:"font-medium mb-1",children:"Docent = Private Tutor"}),f("p",{className:"text-[#666] dark:text-[#999]",children:"You hand it a 300-page PDF on Quantum Comput from datetime import datetime

GoalType = Literal['exam','understand','implement','research']

class Document(BaseModel):
    id: str
    filename: str
    status: Literal['processing','ready','failed']
    page_count: int = Field(ge=1)
    created_at: datetime

class Chunk(BaseModel):
    id: str
    document_id: str
    content: str = Field(min_length=20)
    embedding: Optional[List[float]] = None
    page_number: int
    chapter_hint: Optional[str] = None
    token_count: int

class Chapter(BaseModel):
    id: str
    document_id: str
    title: str
    order: int
    summary: str
    lesson_count: int = 1

class SourceRef(BaseModel):
    page: int
    chunk_id: str
    snippet: str = Field(max_length=300)

class Lesson(BaseModel):
    id: str
    chapter_id: str
    goal_type: GoalType
    title: str
    explanation: str
    analogy: str
    key_points: List[str] = Field(min_length=2, max_length=5)
    source_refs: List[SourceRef] = Field(min_length=1, max_length=4)

class QuizQuestion(BaseModel):
    id: str
    lesson_id: str
    question: str
    options: List[str] = Field(min_length=4, max_length=4)
    correct_index: int = Field(ge=0, le=3)
    explanation: str

class UserProgress(BaseModel):
    document_id: str
    completed_lessons: List[str] = []
    scores: Dict[str, int] = {}
    weak_areas: List[str] = []
    overall_progress: int = Field(ge=0, le=100)`})]}),g("section",{id:"tech-stack",className:"scroll-mt-24 mb-20",children:[g("div",{className:"mb-6 flex items-baseline gap-3",children:[f("span",{className:"font-mono text-[11px] text-[#999] tracking-widest",children:"06"}),f("h2",{className:"font-serif text-[30px] leading-[1.1] tracking-[-0.02em]",style:{fontFamily:"Instrument Serif, serif"},children:"Tech Stack"})]}),f("p",{className:"text-[13px] text-[#666] dark:text-[#999] mb-8",children:"Standardized only. No experimental libs. Chosen for speed in 36h."}),g("div",{className:"grid grid-cols-1 md:grid-cols-2 gap-10",children:[g("div",{children:[f("div",{className:"text-[11px] tracking-widest uppercase text-[#999] mb-4",children:"Backend — Python"}),f("div",{className:"space-y-4 text-[13px] leading-[1.6]",children:[["FastAPI","API framework. Auto docs, Pydantic native, async. De-facto standard for Python LLM backends."],["Pydantic v2","Validation. 10x faster than v1, strict types, JSON schema generation for frontend sync."],["SQLAlchemy 2.0 + Alembic","ORM + migrations. Async support, typed."],["PostgreSQL + pgvector","DB + vector in one. Avoids separate vector DB ops. HNSW index. Fallback: Qdrant if pgvector setup blocks."],["PyMuPDF / pdfplumber","PDF parsing. PyMuPDF for speed + layout, pdfplumber fallback for tables."],["tiktoken","Token counting. Accurate chunking, prevents context overflow."],["OpenAI / DeepSeek SDK","LLM. Interchangeable via orchestrator adapter. JSON mode required."],["pytest + httpx","Tests. Async client tests, fast."]].map(([s,m])=>g("div",{className:"flex gap-3",children:[f("span",{className:"font-mono font-medium shrink-0 text-[#111] dark:text-[#ededed]",children:s}),f("span",{className:"text-[#666] dark:text-[#999]",children:m})]},s))})]}),g("div",{children:[f("div",{className:"text-[11px] tracking-widest uppercase text-[#999] mb-4",children:"Frontend — TypeScript"}),f("div",{className:"space-y-4 text-[13px] leading-[1.6]",children:[["
